name: Bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the editor
        2. Import a screenshot
        3. ...
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Template
      placeholder: showcase, bento, mobile-trio…
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130, Windows 11
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / console
      description: Drop images or paste errors from the browser console.
