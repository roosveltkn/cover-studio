name: Bug
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Qu'attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir l'éditeur
        2. Importer une capture
        3. ...
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Modèle concerné
      placeholder: showcase, bento, mobile-trio…
  - type: input
    id: browser
    attributes:
      label: Navigateur et système
      placeholder: Chrome 130, Windows 11
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran / console
      description: Glissez des images ou collez les erreurs de la console.
