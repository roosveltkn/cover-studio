name: Feature
description: Suggest an improvement or a new template
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do, and what is stopping you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How do you picture the solution? Attach a mockup if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this feature
