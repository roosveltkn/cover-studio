name: Fonctionnalité
description: Proposer une amélioration ou un nouveau modèle
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème ou besoin
      description: Qu'essayez-vous de faire et qu'est-ce qui vous en empêche ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Comment imaginez-vous la solution ? Joignez une maquette si possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: Je souhaite travailler sur cette fonctionnalité
