name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm capture:typecheck
      - run: pnpm capture:test

      # Endpoint factice : il affiche la capture depuis une URL, que les tests
      # E2E simulent avec page.route (aucun appel au vrai service).
      - run: pnpm build
        env:
          NEXT_PUBLIC_CAPTURE_ENDPOINT: https://capture.test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
